<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>OTB Chess Scoresheet</title>
  <link rel="stylesheet" href="style.css?v=20260525-result" />
</head>
<body>
  <main class="app">
    <header class="app__header">
      <h1>OTB Chess Scoresheet</h1>
      <p>Tap source, then destination. Legal moves only.</p>
    </header>

    <section class="metadata" aria-label="Game metadata">
      <label class="field">
        <span>My color</span>
        <select id="myColorInput">
          <option value="white">White</option>
          <option value="black">Black</option>
        </select>
      </label>
      <label class="field">
        <span>Opponent</span>
        <input id="opponentInput" type="text" autocomplete="off" placeholder="Opponent name" />
      </label>
      <label class="field">
        <span>Round</span>
        <input id="roundInput" type="number" min="1" step="1" inputmode="numeric" />
      </label>
      <label class="field">
        <span>Date</span>
        <input id="dateInput" type="date" />
      </label>
    </section>

    <section class="result-panel" aria-label="Game result">
      <label class="field">
        <span>Result</span>
        <select id="resultInput">
          <option value="*">Unfinished (*)</option>
          <option value="1-0">White wins (1-0)</option>
          <option value="0-1">Black wins (0-1)</option>
          <option value="1/2-1/2">Draw (1/2-1/2)</option>
        </select>
      </label>
      <div class="result-actions" aria-label="Quick result buttons">
        <button id="whiteResignsBtn" class="btn" type="button">White resigns</button>
        <button id="blackResignsBtn" class="btn" type="button">Black resigns</button>
        <button id="drawResultBtn" class="btn" type="button">Draw</button>
      </div>
      <p id="resultStatus" class="result-status" aria-live="polite"></p>
    </section>

    <section class="board-section" aria-label="Chessboard section">
      <div id="board" class="board" role="grid" aria-label="Chess board"></div>
      <p id="status" class="status" aria-live="polite"></p>
    </section>

    <section class="controls" aria-label="Game controls">
      <button id="undoBtn" class="btn">Undo</button>
      <button id="newGameBtn" class="btn btn--danger">New Game</button>
      <button id="flipBtn" class="btn">Flip Board</button>
      <button id="copyPgnBtn" class="btn">Copy PGN</button>
      <button id="copyLichessBtn" class="btn">Copy PGN & Open Lichess</button>
      <button id="exportPgnBtn" class="btn">Export .pgn</button>
    </section>

    <section class="moves" aria-label="Move list">
      <h2>Moves</h2>
      <ol id="moveList" class="move-list"></ol>
    </section>
  </main>

  <script type="module" src="app.js?v=20260525-result"></script>
</body>
</html>
